# Всеки провал, етикетиран преди да е пипнат код
#
# Стъпка 2 от цикъла. Етикетът е **четене**, не присъда: той казва каква форма
# има провалът, за да се знае каква поправка иска и колко струва. Промяна в
# числото не минава оттук — минава през `adjudications.yml`, вързана за
# отпечатъка на находката. Codex беше изричен: `is_target` остава груб
# генератор на кандидати, а всяко изключение, което мести резултат, минава през
# слоя за отсъждане.
#
# Етикетите:
#
#   missed                 нищо в опасния член не съвпада с ключа
#   incidental_candidate   безопасният член има находка, която ключът също
#                          хваща, но описва друга слабост — кандидат за
#                          отсъждане, не установен факт
#   incomplete_fix         безопасният член описва същия механизъм като целта;
#                          ако е вярно, поправката на автора е непълна и
#                          случаят не може да мери нищо
#   unread                 още не е прочетен
#
# Симетрията, която прави това честно: същият въпрос е зададен и на 29-те
# минаващи двойки — дали преброената находка е слабостта от advisory-то, или
# съседна. Всичките издържаха. Процедура, която пита само за провалите, може
# само да подобрява числото.

