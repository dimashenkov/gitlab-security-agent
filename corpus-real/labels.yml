  # ------------------------------------------------------- incomplete_fix
  # The safe member describes the same mechanism as the target. If that is true,
  # the author's fix does not close its own weakness and the case cannot measure
  # discrimination in either direction — the same grounds as the six already
  # adjudicated. Each of these needs the code read before it becomes an
  # adjudication.

  - case_id: py-g7gc-gmgp-wgqg-snap
    label: incidental_candidate
    state: read
    was: incomplete_fix
    note: >-
      Read 2026-08-30 and the label is corrected. The fix replaces a loop of
      regex substitutions — the quadratic one the advisory is about — with a
      single linear pass over characters, and drops `noparenthesis_regex`
      entirely. The finding in the safe member is about a *different*,
      dynamically built regex. Similar words, different code: reading by title
      misled me.
  - case_id: ts-w4mq-xh27-6xpx-snap
    label: incidental_candidate
    state: read
    was: incomplete_fix
    note: >-
      Read 2026-08-30 and the label is corrected. The advisory is about the
      global `Mustache.escape = ...`, which turns escaping off for the whole
      process; the fix makes it local to one call. The finding in the safe
      member says `createdBy` is treated as a template — true in both members
      and untouched by the fix, so a different weakness.
  - case_id: py-8x5v-cpv7-8jjp-snap
    label: incomplete_fix
    state: read
    note: >-
      Read to the end 2026-08-30. `_is_global_addr` unwraps NAT64, 6to4, Teredo
      and ipv4-mapped correctly — the check itself is good. But the resolver is
      only called when a *name* is resolved: aiohttp skips the resolver when the
      host is already a literal address, and then nothing checks it. A redirect
      to a literal internal address walks past the fence — the same outcome as
      the advisory, by a route the fix does not close.
    caveat: >-
      aiohttp's behaviour with a literal address is common knowledge here, not
      read from the source. Worth checking in the installed version's code
      before adjudicating.
  - case_id: php-gvrw-qqp5-jgc5
    label: incomplete_fix
    state: read
    note: >-
      Read 2026-08-30 and the label stands. The fix adds
      `removeDangerousAttributes` with an allowlist of attributes; the finding
      in the safe member is about *that new code* — that the list is bypassed.
      That is the same mechanism the advisory is about. The claim is plausible:
      the outer regex is anchored — `#^<iframe...#` — so it catches an iframe
      only if it is the first thing in the html, and a wrapper or a space before
      it leaves the whole guard unapplied. A candidate for a
      `case_is_malformed` adjudication once the regex is checked.

  # ---------------------------------------- read later
  # Codex pointed out that for `php-pg62` I had looked at the unfinished run —
  # there is a finished one too.

  - case_id: php-pg62-f8g4-4wqh
    label: incomplete_fix
    state: read
    note: >-
      Read 2026-08-30. The unsafe member finds the target correctly. The fix
      adds a check in `updatePermissions` — that you cannot grant a right you do
      not have. The finding in the safe member is about `updateMembers`, another
      method, which adds to a group without the same check: a different route,
      the same outcome — privilege escalation. Exactly the grounds on which
      `py-6x92` and `cs-q939` are already adjudicated: "the same outcome by a
      second route the fix does not close".
  - case_id: ts-v667-gc2r-2xm7
    label: incomplete_fix
    state: read
    note: >-
      Read 2026-08-30, and it is the strongest finding of them all. The fix adds
      `/open/user/init` to the list — and in the same call swaps `pathLower` for
      `req.path`, which **loses the lowercasing**. So `/API/user/init` no longer
      matches and walks past the check. The finding in the safe member says
      exactly that. The reviewer found a regression introduced by the fix
      itself — not an omission by the author, but a defect in his solution.
