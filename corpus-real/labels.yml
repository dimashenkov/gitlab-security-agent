# Every failure, labelled before any code was touched
#
# Step 2 of the cycle. A label is a **reading**, not a verdict: it says what
# shape the failure has, so that what fix it wants and what it costs are known.
# A change to the number does not go through here — it goes through
# `adjudications.yml`, anchored to the finding's fingerprint. Codex was
# explicit: `is_target` stays a coarse candidate generator, and every exception
# that moves a result goes through the adjudication layer.
#
# The labels:
#
#   missed                 nothing in the unsafe member matches the key
#   incidental_candidate   the safe member has a finding the key also catches,
#                          but it describes a different weakness — a candidate
#                          for adjudication, not an established fact
#   incomplete_fix         the safe member describes the same mechanism as the
#                          target; if that is true, the author's fix is
#                          incomplete and the case cannot measure anything
#   unread                 not read yet
#
# The symmetry that makes this honest: the same question was put to the 29
# passing pairs too — is the counted finding the weakness from the advisory, or
# a neighbouring one. All of them held. A procedure that asks only about the
# failures can only improve the number.

labels:

  # ---------------------------------------------------------------- missed
  # The unsafe member produced no finding the key recognises. Eight of them
  # reported a *different* weakness, seven reported nothing — the difference
  # matters for the fix and is noted.

