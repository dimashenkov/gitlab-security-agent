  # ------------------------------------------------------- incomplete_fix
  # Безопасният член описва същия механизъм като целта. Ако е вярно, поправката
  # на автора не затваря собствената си слабост и случаят не може да мери
  # дискриминация в никоя посока — същото основание като вече отсъдените шест.
  # Всеки от тях иска четене на кода, преди да стане отсъждане.

  - case_id: py-g7gc-gmgp-wgqg-snap
    label: incidental_candidate
    state: read
    was: incomplete_fix
    note: >-
      Прочетено 2026-08-30 и етикетът е поправен. Поправката заменя цикъл от
      регулярни замени — квадратичният, за който е advisory-то — с един линеен
      обход по знаци, и маха `noparenthesis_regex` съвсем. Находката в
      безопасния член е за *друга*, динамично построена регулярка. Сходни думи,
      различен код: четенето по заглавие ме подведе.
  - case_id: ts-w4mq-xh27-6xpx-snap
    label: incidental_candidate
    state: read
    was: incomplete_fix
    note: >-
      Прочетено 2026-08-30 и етикетът е поправен. Advisory-то е за глобалното
      `Mustache.escape = ...`, което изключва екранирането за целия процес;
      поправката го прави локално за едно извикване. Находката в безопасния
      член казва, че `createdBy` се третира като шаблон — вярно и в двата члена
      и незасегнато от поправката, тоест друга слабост.
  - case_id: py-8x5v-cpv7-8jjp-snap
    label: incomplete_fix
    state: read
    note: >-
      Прочетено докрай 2026-08-30. `_is_global_addr` разгъва NAT64, 6to4,
      Teredo и ipv4-mapped правилно — самата проверка е добра. Но резолверът се
      вика само при разрешаване на *име*: aiohttp прескача резолвера, когато
      хостът вече е буквален адрес, и тогава нищо не проверява. Пренасочване
      към буквален вътрешен адрес минава покрай оградата — същият изход като
      advisory-то, по маршрут, който поправката не затваря.
    caveat: >-
      Поведението на aiohttp при буквален адрес е от общо знание, не е
      прочетено от източника тук. Преди отсъждане си струва да се провери в
      кода на инсталираната версия.
  - case_id: php-gvrw-qqp5-jgc5
    label: incomplete_fix
    state: read
    note: >-
      Прочетено 2026-08-30 и етикетът остава. Поправката добавя
      `removeDangerousAttributes` със списък от разрешени атрибути; находката в
      безопасния член е за *този нов код* — че списъкът се заобикаля. Тоест
      същият механизъм, за който е advisory-то. Твърдението е правдоподобно:
      външната регулярка е закотвена — `#^<iframe...#` — значи хваща iframe
      само ако е първото нещо в html-а, а обвивка или интервал преди него
      оставя цялата защита неприложена. Кандидат за отсъждане `case_is_malformed`
      след проверка на регулярката.

