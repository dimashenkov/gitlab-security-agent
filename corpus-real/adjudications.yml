      `known_failure` rather than a limitation, and the difference is the whole
      point. A limitation removes the case from measurement for good, and this
      case measures something precise and valuable: whether a semantically
      wrong finding can survive the verifier and gate a merge. Removing it
      would close the accounting by discarding the best regression test in the
      corpus for that question. It stays in the set, it stays a failure, and
      `LIMITATIONS.md` says what the failure is.

