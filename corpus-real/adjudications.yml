  # The finding the reviewer reported instead of the target. It sits in the
  # *unsafe* member, so it changes no score either way: the pair already fails
  # because the CSRF target was never named. Recorded because a row that says
  # only "missed" implies the reviewer found nothing, and it found something.
  #
  # Read on 2026-08-30, and the reading was corrected once. What is shown is the
  # ordering: getRequestedController builds \<module>\Controllers\<name> from
  # URL segments, findController turns it into a path under base_path()/modules
  # and reaches include_once, and the backend's BackendAuth::check() runs later,
  # inside Controller::run. The outer middleware calls $next before its own
  # inspection. So: no authentication barrier is visible before inclusion on
  # this dispatch path — phrased that way, because no deployment-level
  # middleware was audited.
  #
  # What is *not* shown is everything the word "critical" rests on, and it is
  # more than one missing helper:
  #   - that a traversal segment survives HTTP and route normalisation at all;
  #   - which path it resolves to;
  #   - that an existing .php file sits there;
  #   - that including it does anything, since inclusion runs top-level code and
  #     that is where impact would come from.
  # RouterHelper::segmentizeUrl is unreadable here (Winter\Storm is not
