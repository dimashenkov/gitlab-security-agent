      code exists, not that the conclusion follows from it; the verifier is the
      layer meant to refute the reasoning and it agreed. A rule written for
      `Some(&self.current)` in this file would be the corpus answering its own
      question. What would change it is a prompt or verifier-policy change,
      which produces a new version to be measured rather than a repair to be
      confirmed.

