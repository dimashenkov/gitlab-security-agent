  - case_id: cs-q939-rpr3-3284
    member: safe
    file: src/Renci.SshNet/ScpClient.cs
    severity_reported: medium
    claim: An 'E' message before any 'D' walks the download above its target
    verdict: real
    adjudicated_on: 2026-08-28
    evidence: >-
      `InternalDownload` starts with `directoryCounter = 0` and
      `currentDirectoryFullName = startDirectoryFullName`. On `E` it decrements
      first and breaks only on exactly zero, so a first message of `E` leaves
      the counter at -1, does not break, and sets the current directory to
      `new DirectoryInfo(currentDirectoryFullName).Parent` — the parent of the
      directory the caller asked to download into. A following `C0644 n name`
      takes the `fileSystemInfo is not FileInfo` branch and writes to
      `Path.Combine(currentDirectoryFullName, fileName)`, one level above the
      target; each further `E` climbs another level, and the `directoryCounter
      == 0` break after the write is never reached at -1. `EnsureValidLocalName`
      is the maintainers' fix and it validates a *name*: there is no `..` and no
      separator here, so it passes. The only guard on the climb is
      `Debug.Assert`, which a release build does not contain — a stated
      invariant that shipped code does not enforce. The same code is in
      sshnet/SSH.NET `main` as read on 2026-08-28.
    case_is_malformed: true
    why_malformed: >-
      The advisory is CWE-22/CWE-73 — an SCP recursive download writing outside
      its target — and this is that outcome by a second route the fix does not
      close. So the safe member still carries the weakness the case is about,
      and a pair whose safe member carries it cannot measure discrimination in
      either direction. Exclude it from the score; do not count it as a failure.
    reported_upstream: no
    reported_upstream_note: >-
      Not our call to make unilaterally, and not published here beyond the
      reading above. Decide before this file goes anywhere public.

  - case_id: py-6x92-6vx4-5fwr
    member: safe
    file: cms/admin/forms.py
    severity_reported: medium
    claim: >-
      The add-subpage permission check reads parent_page from GET while the form
      takes it from POST
    verdict: real
    adjudicated_on: 2026-08-28
    evidence: >-
      `PageAdmin._has_add_permission_from_request` in `cms/admin/pageadmin.py`
      reads `request.GET.get("parent_page")`, and falls back to
      `user_can_add_page(user, site)` — the global "may add a page at all"
      permission — when it is absent. `parent_page` on the form is an ordinary
      field and arrives in the body. `clean_parent_page` in the changed file
      checks `parent_page.site_id != self._site.pk` and nothing else, and the
      fix under review adds `clean_cms_page` and `clean_source` while leaving
      `parent_page` unguarded. A POST to the add view with no query string and
      `parent_page` in the body is therefore authorised by the global check and
      creates a child under a parent the user has no `add_subpage` right on.
    not_verifiable: >-
      Whether the admin's own form posts back to a URL that keeps
      `?parent_page=`, which would make the GET check see it on the ordinary
      path. It does not affect the finding — an attacker posts where they like —
      but it decides whether the ordinary path is also exposed.
    case_is_malformed: true
    why_malformed: >-
      The advisory is CWE-639/CWE-862 broken access control in page
      administration, and this is broken access control in page administration
      by a route the fix does not close. The safe member still carries the
      weakness the case is about, so the pair cannot measure discrimination.
      Exclude it from the score; do not count it as a failure.
    reported_upstream: no
    reported_upstream_note: >-
      Not our call to make unilaterally, and not published here beyond the
      reading above. Decide before this file goes anywhere public.

  - case_id: rs-8rw6-p7m8-63jp-snap
    member: safe
    file: surrealdb/core/src/doc/output.rs
    severity_reported: high
    claim: Computed fields are re-added after permission reduction
    verdict: real
    adjudicated_on: 2026-08-24
    incidental: true          # unrelated to the advisory, which is about
                              # array element-level `field.*` SELECT permissions
    evidence: >-
      `output_select` computes fields, reduces the document, and then computes
      fields again on the reduced document. `reduce_document` cuts computed
      fields whose `select_permission` is `None` or falsy;
      `computed_fields_inner` then writes the value back with no permission
      check. The memo flag does not stop it: `reduce_document` returns a fresh
      `CursorDoc`, and `CursorDoc::new` sets `fields_computed: false`. A record
      user selecting an expression over the field —
      `SELECT string::concat(secret_computed, '') AS x` — gets it: the backstop
      `apply_select_field_permissions` cuts paths named for the field, and the
      projection is named `x`. The maintainers agree the re-filter is required:
      `filter_computed_field_permissions` exists for exactly this and is wired
      into the live-query path in `lives.rs` and into no path in `output.rs`.
    not_verifiable: >-
      `expr/field.rs` is absent from the corpus, so `Fields::compute` cannot be
      read to prove it applies no permission check of its own.

  - case_id: php-p2ch-c2c3-4xm5-snap
    member: safe
    file: modules/backend/classes/Controller.php
    severity_reported: medium
    claim: execPageAction discards its 404 and invokes actions that failed
    verdict: not_real
    adjudicated_on: 2026-08-24
    incidental: true
    evidence: >-
      The first half is true — `Response::make(View::make('backend::404'), 404)`
      is built and discarded, and control falls through to
      `call_user_func_array`. The second half does not happen. Every caller
      validates with the identical predicate on the identical object first:
      `BackendController::resolveController` runs `$controllerObj->actionExists($action)`
      and stores null otherwise, and only a non-null controller is run. The
      other two callers pass `$this->action`, the same validated value. The one
      way the two checks could diverge is `hiddenActions` growing between them,
      and it cannot: `ControllerBehavior::hideAction` runs from the behavior's
      constructor, which runs inside `Controller::__construct` via
      `extendableConstruct()` — before the check.
    # What this one is evidence of, which matters more than the verdict.
    failure_mode: reachability-discipline
    failure_mode_detail: >-
      A genuine local defect, correctly described at the statement level,
      promoted to a security weakness without reading the caller. The reviewer
      stopped one hop short of the gate that refutes it. Not fabrication — the
      quoted code is real and the description of it is accurate — but the claim
      that makes it a security finding was never checked.
