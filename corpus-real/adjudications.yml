  - case_id: cs-q939-rpr3-3284
    member: safe
    file: src/Renci.SshNet/ScpClient.cs
    severity_reported: medium
    claim: An 'E' message before any 'D' walks the download above its target
    verdict: real
    adjudicated_on: 2026-08-28
    evidence: >-
      `InternalDownload` starts with `directoryCounter = 0` and
      `currentDirectoryFullName = startDirectoryFullName`. On `E` it decrements
      first and breaks only on exactly zero, so a first message of `E` leaves
      the counter at -1, does not break, and sets the current directory to
      `new DirectoryInfo(currentDirectoryFullName).Parent` — the parent of the
      directory the caller asked to download into. A following `C0644 n name`
      takes the `fileSystemInfo is not FileInfo` branch and writes to
      `Path.Combine(currentDirectoryFullName, fileName)`, one level above the
      target; each further `E` climbs another level, and the `directoryCounter
      == 0` break after the write is never reached at -1. `EnsureValidLocalName`
      is the maintainers' fix and it validates a *name*: there is no `..` and no
      separator here, so it passes. The only guard on the climb is
      `Debug.Assert`, which a release build does not contain — a stated
      invariant that shipped code does not enforce. The same code is in
      sshnet/SSH.NET `main` as read on 2026-08-28.
    case_is_malformed: true
    why_malformed: >-
      The advisory is CWE-22/CWE-73 — an SCP recursive download writing outside
      its target — and this is that outcome by a second route the fix does not
      close. So the safe member still carries the weakness the case is about,
      and a pair whose safe member carries it cannot measure discrimination in
      either direction. Exclude it from the score; do not count it as a failure.
    reported_upstream: no
    reported_upstream_note: >-
