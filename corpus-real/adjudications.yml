      `apply_select_field_permissions` cuts paths named for the field, and the
      projection is named `x`. The maintainers agree the re-filter is required:
      `filter_computed_field_permissions` exists for exactly this and is wired
      into the live-query path in `lives.rs` and into no path in `output.rs`.
    not_verifiable: >-
      `expr/field.rs` is absent from the corpus, so `Fields::compute` cannot be
      read to prove it applies no permission check of its own.

