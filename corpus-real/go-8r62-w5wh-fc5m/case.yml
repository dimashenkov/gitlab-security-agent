case_id: go-8r62-w5wh-fc5m
language: go
family: sensitive-data-exposure
framework: ''
# Harvested from a published advisory, not written by hand. Ground
# truth is the maintainers' own fix; this file lives outside the
# built repository, so the agent never sees it.
source_advisory: GHSA-8r62-w5wh-fc5m
source_cve: CVE-2026-67448
source_repo: axllent/mailpit
source_fix_commit: fbe5e006c3f1682b819df58b4a932d7a84920be9
source_cwes: [CWE-177, CWE-200, CWE-346]
severity_reported: medium
construction: regression
# regression: the two members review the same lines in opposite
#   directions — safe adds the maintainers' fix, unsafe reverts it.
#   Exactly symmetric, but every unsafe member deletes something, so
#   direction predicts the answer and a removed-control rule scores
#   well here without recognising anything.
# snapshot: both members add an implementation from a shared
#   baseline, one fixed and one not. Direction carries no answer.
# Never score the two constructions together.
decisive_control: the change the maintainers shipped as the fix
# The advisory lists CWE-177, CWE-200 and CWE-346, and the weakness is
# the origin check bypass — CWE-346. That row was missing from the
# table, so the lookup fell through to CWE-200 and scored the case as
# sensitive-data-exposure, which is the consequence of the bypass and
# not the bypass.
#
# One category, not both. These are two different weaknesses in one
# file, so accepting either would pass a review that reports the data
# exposure and never notices the bypass — and the target file cannot
# tell two weaknesses in it apart. Contrast ts-w4mq-xh27-6xpx, where
# the two labels are two words for the same weakness.
expected_category: ['authn-authz']
# Every file the fix touched, not the first one. A fix is not obliged
# to fit in one file, and naming only the first counted a finding in
# the others as the wrong place — Winter's CSRF fix normalises a name
# in BackendController.php and rejects the bad ones in Controller.php.
# Repository-relative, because `Controller.php` alone would also match
# `BackendController.php`.
expected_file: ['server/server.go', 'server/websockets/client.go']
dropped_from_change: []
summary: 'Mailpit: WebSocket origin check bypass via percent-encoded path (regression of CVE-2026-22689)'
