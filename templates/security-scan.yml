# Reusable AI security review job.
#
# Add to a project's .gitlab-ci.yml:
#
#   include:
#     - project: 'security/gitlab-security-agent'   # where the agent is hosted
#       ref: main                                   # pin a tag in production
#       file: '/templates/security-scan.yml'
#       inputs:
#         image: registry.example.com/security/gitlab-security-agent:latest
#         stage: test
#
# `image` is required and has no default — see the note on it below.
#
# For `include: project:` to work, the consuming project must be able to read
# the agent project: same GitLab instance, and either the agent project is
# public/internal, or the consuming project is listed under the agent's
# Settings → CI/CD → Job token permissions → allowlist. A private agent project
# with an empty allowlist fails with "Project not found or access denied",
# which reads like a typo in the path rather than a permissions setting.
#
# Required CI/CD variables on the consuming project (Settings → CI/CD →
# Variables), both masked:
#
#   ANTHROPIC_API_KEY            the Anthropic API key
#   SECURITY_SCAN_GITLAB_TOKEN   project or group access token with `api` scope,
#                                used to post the review as a merge request
#                                comment. CI_JOB_TOKEN cannot create notes, so
#                                without this the review still runs and is
#                                attached as an artifact, just not commented.
#
# Protect both variables so they are not exposed to pipelines on unprotected
# branches, and remember that a fork pipeline does not receive them at all.

spec:
  inputs:
    stage:
      default: test
      description: Pipeline stage to run the review in.
    job_name:
      default: ai-security-review
      description: Name of the generated job.
    image:
      # Deliberately has no default. The image is built and pushed by this
      # project's own pipeline to *its* container registry, so the address
      # depends on where the agent is hosted and cannot be guessed here. A
      # plausible-looking default would fail at job start with an image pull
      # error; with the input required, GitLab refuses to create the pipeline
      # and names the missing input instead.
      #
      # Find it under Deploy → Container Registry on the agent project. Prefer
      # a digest (`...@sha256:...`) over `latest`: the job holds an API key and
      # a GitLab token, and `latest` means whatever was pushed most recently.
      description: >-
        Required. Image containing the agent, e.g.
        registry.example.com/security/gitlab-security-agent@sha256:<digest>.
    model:
      default: claude-opus-5
      description: Model id used for the review.
    effort:
      default: high
      options: [low, medium, high, xhigh, max]
      description: Reasoning effort. `xhigh` reviews harder and costs more.
    fail_on:
      default: high
      options: [critical, high, medium, low, none]
      description: Severity at which a finding blocks the merge.
    min_confidence:
      default: medium
      options: [high, medium, low]
      description: Lowest confidence allowed to block a merge.
    ungated_categories:
      default: ''
      description: >-
        Comma-separated categories that never block in this project, e.g.
        "denial_of_service". Findings in them are still reported in full and
        marked as not gated — this is a visible policy, not a filter.
    verify_votes:
      default: '1'
      description: >-
        Independent verifiers per finding. Anything that could end with the
        merge blocked gets at least three, whatever this is set to, and the
        panel is always an odd number so a majority decides rather than a
        single hedge. Note "could end blocked", not "is rated high": a medium
        finding under a high threshold can be corrected upward by its own
        verifier and block on that alone, so it is sized like one.
    max_turns:
      default: '60'
      description: Ceiling on agent turns; raise for large merge requests.
    max_runtime:
      default: '2700'
      description: Wall-clock ceiling in seconds.
    allow_failure:
      type: boolean
      default: false
      description: >-
        Set true to roll the gate out as a warning first. The job still reports
        findings; it just stops blocking the pipeline.
    skip_label:
      default: skip-ai-security
      description: Merge request label that skips the review.
    timeout:
      default: 1h
      description: GitLab job timeout.

"$[[ inputs.job_name ]]":
  stage: $[[ inputs.stage ]]
  image: $[[ inputs.image ]]
  timeout: $[[ inputs.timeout ]]
  allow_failure: $[[ inputs.allow_failure ]]
  interruptible: true

  variables:
    # The agent diffs against the merge request's base commit, which must be
    # present in the clone. A shallow fetch is the single most common reason
    # this job fails to find a diff base.
    GIT_DEPTH: 0
    GIT_STRATEGY: fetch
    SECURITY_SCAN_MODEL: $[[ inputs.model ]]
    SECURITY_SCAN_EFFORT: $[[ inputs.effort ]]
    SECURITY_SCAN_FAIL_ON: $[[ inputs.fail_on ]]
    SECURITY_SCAN_MIN_CONFIDENCE: $[[ inputs.min_confidence ]]
    SECURITY_SCAN_UNGATED_CATEGORIES: $[[ inputs.ungated_categories ]]
    SECURITY_SCAN_VERIFY_VOTES: $[[ inputs.verify_votes ]]
    SECURITY_SCAN_MAX_TURNS: $[[ inputs.max_turns ]]
    SECURITY_SCAN_MAX_RUNTIME: $[[ inputs.max_runtime ]]
    SECURITY_SCAN_OUTPUT_DIR: .security-scan

  rules:
    # Merge request pipelines only. On a branch pipeline there is no merge
    # request to comment on and no reliable base to diff against; a repo-wide
    # review is a separate, scheduled job (see `ai-security-review-full` below).
    #
    # The skip label is *not* a rule here. `when: never` meant a labelled merge
    # request produced no job, no artifact and no note — and the note from the
    # run before the label went on stayed up, still claiming its verdict. The
    # agent honours the same label itself (`--skip-label` below), exits 0
    # without contacting the model, and writes an artifact saying the review
    # was skipped. A skip costs runner seconds and no tokens; what it buys is a
    # record that the review did not happen.
    - if: $CI_MERGE_REQUEST_IID

  script:
    - gitlab-security-agent --skip-label "$[[ inputs.skip_label ]]"

  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - .security-scan/
    # Exposed in the merge request widget so the report is one click away even
    # when the comment could not be posted.
    expose_as: 'AI security review'


# Scheduled whole-repository review. Not included by default: enable it by
# adding a pipeline schedule with SECURITY_SCAN_FULL set to a non-empty value.
"$[[ inputs.job_name ]]-full":
  stage: $[[ inputs.stage ]]
  image: $[[ inputs.image ]]
  timeout: 3h
  allow_failure: true
  interruptible: false

  variables:
    GIT_DEPTH: 0
    SECURITY_SCAN_MODE: repo
    SECURITY_SCAN_MODEL: $[[ inputs.model ]]
    SECURITY_SCAN_EFFORT: $[[ inputs.effort ]]
    # A scheduled sweep reports; it does not gate. There is no merge to block,
    # and a red scheduled pipeline every night trains people to ignore it.
    SECURITY_SCAN_FAIL_ON: none
    SECURITY_SCAN_MAX_TURNS: '200'
    SECURITY_SCAN_MAX_RUNTIME: '9000'
    SECURITY_SCAN_OUTPUT_DIR: .security-scan

  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SECURITY_SCAN_FULL

  script:
    - gitlab-security-agent --mode repo

  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - .security-scan/
