[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gitlab-security-agent"
version = "0.1.0"
description = "AI security review gate for GitLab CI/CD, powered by the Claude API"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Dimitar Shenkov", email = "dimitar.shenkov@gmail.com" }]
maintainers = [{ name = "Dimitar Shenkov", email = "dimitar.shenkov@gmail.com" }]
keywords = ["security", "gitlab", "ci", "code-review", "claude", "sast"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/dimashenkov/gitlab-security-agent"
Source = "https://github.com/dimashenkov/gitlab-security-agent"
Issues = "https://github.com/dimashenkov/gitlab-security-agent/issues"
dependencies = [
    # Bounded on purpose — see requirements.txt for what an unbounded
    # `anthropic` did to the first CI run.
    "anthropic>=0.116.0,<1.0.0",
    "jsonschema>=4.21,<5",
    "PyYAML>=6.0,<7",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
gitlab-security-agent = "security_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
security_agent = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Correctness and clarity rules only. The pyupgrade set is deliberately left
# out: the package supports Python 3.9, and rewriting to 3.10+ syntax would
# break the interpreter this is developed against.
select = ["E", "F", "W", "I", "B", "SIM", "RUF", "PLW", "DTZ"]
ignore = [
    "E501",    # line length is handled by the formatter, not the linter
    "RUF001",  # the report intentionally uses typographic characters
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
