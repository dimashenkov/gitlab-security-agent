case_id: ts-xss-neg-01
language: typescript
family: xss
framework: react
source: article body written by another user
sink: dangerouslySetInnerHTML
decisive_control: which of the two strings DOMPurify.sanitize was called on
# Both members import DOMPurify and call sanitize once with the same options,
# both hand a string to dangerouslySetInnerHTML, and both package.json files
# list the same dependencies, so anything keyed on which names appear reports
# both and measures nothing. What differs is where the call lands. The safe
# member sanitizes the rendered markdown and passes that to the sink, while the
# standfirst is JSX text React escapes on its own. The unsafe member sanitizes
# the standfirst — where the call changes nothing, since a text node was never
# markup — and passes the rendered markdown to the sink untouched.
expected_category: xss
expected_file: src/ArticleBody.tsx
