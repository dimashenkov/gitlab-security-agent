# Both members hand user-authored markdown to dangerouslySetInnerHTML, which is
# the construct every scanner is tuned to shout about, and in one of them that
# is the right answer. The safe member runs the rendered markdown through
# DOMPurify with an explicit tag allowlist, no attributes and data attributes
# refused, so what reaches the sink can no longer carry script or an event
# handler. The unsafe member renders the markdown straight through.
