# Pipeline for the agent itself: test it, build its image, and review its own
# merge requests with the previous image (dogfooding — if the gate is not good
# enough for this repository, it is not good enough for anyone else's).

stages:
  - test
  - build
  - review
  - evaluate

# One pipeline per commit, not two.
#
# Level 0 runs on every branch now, and the merge-request rule was already
# there — so a push to a branch with an open merge request would start both a
# branch pipeline and a merge-request pipeline. Two green ticks for one commit,
# on two pipelines, and no way to tell which one the merge is gated on.
#
# So: while a merge request is open, only the merge-request pipeline runs.
# Before one is opened, the branch pipeline does. Neither state loses a check.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

default:
  interruptible: true

variables:
  IMAGE: $CI_REGISTRY_IMAGE
  PYTHON_IMAGE: python:3.12-slim

# ---------------------------------------------------------------------- test

# Level 0 of the evaluation regime: everything that can be decided without
# spending a model call, on every commit that reaches the server.
#
# The rules used to be `merge_request_event` or the default branch, so a push to
# a feature branch ran no pipeline at all — and "evaluation after every change"
# was, for most changes, nothing. A check that runs on some pushes is a check
# whose absence is invisible.
#
# `allow_failure` is gone from the lint for the same reason. A gate that reports
# and does not stop is a gate somebody will read as passing.
.level-0: &level-0
  stage: test
  image: $PYTHON_IMAGE
  variables:
    # Full history, not the default depth of 20. `tools/check_decisions.py`
    # resolves the commit every entry in DECISIONS.md cites, and the oldest of
    # those is 55 commits back. In a shallow clone it does not find them and
    # says "commit b19b7bf is not in this repository" — a verdict, where the
    # truth is that it could not look. Nine entries failed that way on the
    # first pipeline this repository ever ran.
    GIT_DEPTH: "0"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

unit-tests:
  <<: *level-0
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git
    - pip install --no-cache-dir -e ".[dev]"
  script:
    - pytest -q

lint:
  <<: *level-0
  before_script:
    - pip install --no-cache-dir ruff
  script:
    # `tools/` too. The evaluator lives there, and a change to the thing that
    # measures the product used to pass unlinted while the product it measures
    # did not.
    - ruff check src/ tests/ tools/

promises-kept:
  <<: *level-0
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git
    - pip install --no-cache-dir -e ".[dev]"
  script:
    # A field whose docstring states a guarantee and whose only reader is its
    # own module is a policy the system was told about and does not apply. This
    # is the grep that finds them, and it was written after one such field let
    # `--profile probe` conclude a review it was documented never to conclude.
    - PYTHONPATH=src python3 tools/unenforced.py --strict
    # And the decision log, checked against the commits it claims to describe.
    - PYTHONPATH=src python3 tools/check_decisions.py

# --------------------------------------------------------------------- build

build-image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  before_script:
    # Kaniko does not read GitLab's registry credentials on its own; without
    # this the push fails with a 401 that reads like a permissions problem.
    # CI_REGISTRY_PASSWORD is the job token, scoped to this project's registry.
    - mkdir -p /kaniko/.docker
    - |
      printf '{"auths":{"%s":{"auth":"%s"}}}' \
        "$CI_REGISTRY" \
        "$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')" \
        > /kaniko/.docker/config.json
  script:
    # Tag by commit SHA always; move `latest` only on the default branch, so a
    # consuming project pinned to `latest` never picks up an unmerged change.
    - |
      DESTINATIONS="--destination $IMAGE:$CI_COMMIT_SHORT_SHA"
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        DESTINATIONS="$DESTINATIONS --destination $IMAGE:latest"
      fi
      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/Dockerfile" \
        $DESTINATIONS
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - Dockerfile
        - requirements.txt
        - pyproject.toml
        - src/**/*
        - prompts/**/*
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# -------------------------------------------------------------------- review

# The agent reviewing its own merge requests.
#
# Deliberately runs `:latest` — the image built from the default branch — and
# uses the prompts baked into it, never the ones in the branch under review. A
# merge request that edits a prompt is reviewed by the *current trusted* prompt,
# not by the version it is proposing. Pointing SECURITY_SCAN_PROMPT_DIR at the
# checkout here would let any merge request rewrite the instructions of the
# agent reviewing it, which is the exact hole the prompt-loading rules exist to
# close.
self-review:
  stage: review
  image: $IMAGE:latest
  timeout: 1h
  interruptible: true
  # Advisory, and this is the right way to say so. Setting FAIL_ON=none would
  # also make it advisory and would silently narrow verification: with no
  # threshold there is nothing a verdict can change about gating, so the
  # verifier used to be skipped entirely and the report lost the odd panel, the
  # independent refutation, and the requirement that a confirmation state what
  # it searched for. The scope no longer follows the gate setting, but this is
  # still the honest way to run it non-blocking.
  allow_failure: true
  needs: []
  variables:
    GIT_DEPTH: 0
    # Advisory on this repository too. The gate has not earned the right to
    # stop anyone's merge, including this project's own.
    SECURITY_SCAN_FAIL_ON: high
    SECURITY_SCAN_EFFORT: high
    SECURITY_SCAN_OUTPUT_DIR: .security-scan
  script:
    - gitlab-security-agent
  artifacts:
    when: always
    expire_in: 30 days
    expose_as: 'AI security review'
    paths:
      - .security-scan/
  rules:
    # No `when: never` on the skip label. It produced no job, no artifact and
    # no note, so the note left by the run before the label went on stayed up
    # claiming its verdict. The agent honours the label itself, exits 0 without
    # contacting the model, and records that the review was skipped.
    - if: $CI_MERGE_REQUEST_IID
    # Commits that reach the default branch without a merge request. This
    # repository has none, so for two months the job above never fired and the
    # dogfooding claim in the README was decorative. A job that cannot run is
    # worse than no job: it reads as evidence the tool is used on itself.
    #
    # Manual, because it costs $0.60-3.65 per review and a push is not a
    # decision to spend. `tools/journal.py add` files the artifact afterwards.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual

# ------------------------------------------------------------------ evaluate
#
# The evaluation pipeline, in the shape it will have and the state it is in.
#
# The free half runs on every push. The paid half does not: one pass over the
# corpus is $8-15 at the measured rate, and a gate that spends that on every
# commit is how a measurement budget disappears without producing a number.
# Those jobs are `when: manual` and print what they will cost before they run.
#
# The rest are declared and inert. A stage that is missing is a stage nobody
# argues about; a stage that is present and says why it cannot run is a
# question with a name. None of them exit 0 — this project's whole discipline
# is that "could not check" must never look like "checked and clean", and a
# green placeholder is exactly that lie in CI form.

corpus-check:
  stage: evaluate
  image: $PYTHON_IMAGE
  needs: []
  before_script:
    - pip install --no-cache-dir -e ".[dev]"
  script:
    # Free, deterministic, and every defect it looks for was found by hand
    # after a paid run had already been scored against it.
    - python3 tools/check_corpus.py corpus/ corpus-real/
  rules:
    # Level 0, so every push. Both of these are free and deterministic, and
    # both were gated to merge requests and the default branch — which meant
    # the corpus could be edited on a branch and land unchecked until the
    # merge request opened.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

corpus-adversary:
  stage: evaluate
  image: $PYTHON_IMAGE
  needs: []
  before_script:
    - pip install --no-cache-dir -e ".[dev]"
  script:
    # Can the corpus be scored without reading code? "More comment lines, then
    # more bytes" once scored 48 of 48 on the harvested corpus, because a fix
    # commit carries the maintainer's explanation and harvesting put it on the
    # safe side only. Nothing in the review pipeline would ever have shown it.
    - python3 tools/corpus_adversary.py corpus/ corpus-real/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# --- paid, manual ------------------------------------------------------------

eval-stability:
  stage: evaluate
  image: $PYTHON_IMAGE
  needs: []
  when: manual
  allow_failure: true
  timeout: 2h
  variables:
    CASE: go-sql-01
    RUNS: "4"
  before_script:
    - pip install --no-cache-dir -e ".[dev]"
  script:
    # Before any threshold, not after. A success rate measured once is a sample
    # from a distribution nobody has looked at, and this project has already
    # set two rules from single runs and had to withdraw both.
    - echo "About to run $RUNS reviews. At the measured median that is roughly $(python3 -c "print('%.2f' % ($RUNS * 0.75))") USD."
    - python3 tools/stability.py corpus/ --case "$CASE" --runs "$RUNS" --json stability.json
  artifacts:
    when: always
    expire_in: 90 days
    paths: [stability.json]

eval-corpus:
  stage: evaluate
  image: $PYTHON_IMAGE
  needs: []
  when: manual
  allow_failure: true
  timeout: 3h
  variables:
    CORPUS: corpus/
  before_script:
    - pip install --no-cache-dir -e ".[dev]"
  script:
    - echo "One pass over $CORPUS costs 8-15 USD at the measured rate, with a 4.4x spread per case."
    # `--provider` became required an hour before this line was found missing:
    # omitting it used to select the paid path silently, and this job is the
    # one place where the paid path is the right answer. Named, so the job
    # says which account it charges.
    - python3 tools/pair_corpus.py "$CORPUS" --provider anthropic-api
      --concurrency 1 --json corpus-result.json
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - corpus-result.json
      # The artifacts of anything that stopped early. Deleting these is what
      # turned a one-day diagnosis into "one of two causes, cannot tell".
      - incomplete/

# --- declared, not yet possible ----------------------------------------------

eval-baseline:
  stage: evaluate
  image: $PYTHON_IMAGE
  needs: []
  when: manual
  allow_failure: true
  before_script:
    - pip install --no-cache-dir -e ".[dev]"
  script:
    # Compares a fresh corpus result against the frozen one, and REFUSES when
    # the corpus, prompts, model, settings, scorer version, exclusions or
    # adjudications have moved since the freeze. A delta across a changed
    # prompt is not a change in the reviewer and reads exactly like one.
    #
    # The mechanism exists; baseline.json does not, because populating it takes
    # a paid corpus run. Until then this exits 2 with that sentence, which is
    # the honest state and not a passing check.
    #
    # Exit 2 also means "one case failed once and has not been confirmed" — a
    # question, not a verdict, answered by re-running that one case into a
    # second file and passing both. The suite is measured to move on its own
    # in both directions, so a single pass -> fail is not evidence.
    - test -f baseline.json || { echo "no baseline.json — run eval-corpus, then tools/baseline.py freeze"; exit 2; }
    - python3 tools/baseline.py compare corpus-result.json --baseline baseline.json

eval-gate:
  stage: evaluate
  image: $PYTHON_IMAGE
  needs: []
  when: manual
  allow_failure: true
  script:
    - |
      cat <<'WHY'
      Block the merge when the evaluation regresses below baseline.

      Blocked on two things, and neither is code:

        1. eval-baseline, which does not exist yet.
        2. A threshold. Setting one before run-to-run variance is measured on
           real cases means the gate fires on noise. Stability has been
           measured on ONE synthetic case.

      There is also a cost argument against ever making this automatic on
      push: a pass is $8-15, and an attacker-authored merge request would be
      choosing when to spend it.
      WHY
    - exit 2

eval-canary:
  stage: evaluate
  image: $PYTHON_IMAGE
  needs: []
  when: manual
  allow_failure: true
  script:
    - |
      cat <<'WHY'
      Roll the new version to a subset before making it the default.

      There is nothing to roll to. The product is a CI job another team adds
      to its own .gitlab-ci.yml; there is no deployment, no staging, and no
      consenting team. The release criteria call for a 200-merge-request
      shadow deployment on one team as the first independent evidence, and
      that is what belongs here when it exists.

      Blocked on: an adopter.
      WHY
    - exit 2

journal:
  stage: evaluate
  image: $PYTHON_IMAGE
  needs: []
  before_script:
    - pip install --no-cache-dir -e ".[dev]"
  script:
    # What the reviewer did on code nobody built to be reviewed, and what a
    # person decided about it. Free: it reads what has already been filed.
    # An empty journal exits 2 rather than printing a clean sheet.
    - python3 tools/journal.py report
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

eval-feedback:
  stage: evaluate
  image: $PYTHON_IMAGE
  needs: []
  when: manual
  allow_failure: true
  script:
    - |
      cat <<'WHY'
      Feed adjudicated findings from real changes back into the golden dataset.

      Half of this exists now. `tools/journal.py` files a review of a real
      change and records a human verdict per finding, and the `journal` job
      reports what has accumulated. What it produces is not independent
      evidence — the same person writes the prompts, the code under review and
      the verdicts — but it is the only evidence available that is not a case
      built to be passed.

      Missing: the reviews themselves. self-review only runs on merge requests
      (`if: $CI_MERGE_REQUEST_IID`) and this repository has no merge commits,
      so it has never run here. Either the work starts going through merge
      requests, or commits get reviewed retrospectively against their parents
      at roughly $1.50-3.50 each.

      Independence needs an adopter, and therefore eval-canary.
      WHY
    - exit 2
