# Pipeline for the agent itself: test it, build its image, and review its own
# merge requests with the previous image (dogfooding — if the gate is not good
# enough for this repository, it is not good enough for anyone else's).

stages:
  - test
  - build
  - review

default:
  interruptible: true

variables:
  IMAGE: $CI_REGISTRY_IMAGE
  PYTHON_IMAGE: python:3.12-slim

# ---------------------------------------------------------------------- test

unit-tests:
  stage: test
  image: $PYTHON_IMAGE
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git
    - pip install --no-cache-dir -e ".[dev]"
  script:
    - pytest -q
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

lint:
  stage: test
  image: $PYTHON_IMAGE
  before_script:
    - pip install --no-cache-dir ruff
  script:
    - ruff check src/ tests/
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# --------------------------------------------------------------------- build

build-image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  before_script:
    # Kaniko does not read GitLab's registry credentials on its own; without
    # this the push fails with a 401 that reads like a permissions problem.
    # CI_REGISTRY_PASSWORD is the job token, scoped to this project's registry.
    - mkdir -p /kaniko/.docker
    - |
      printf '{"auths":{"%s":{"auth":"%s"}}}' \
        "$CI_REGISTRY" \
        "$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')" \
        > /kaniko/.docker/config.json
  script:
    # Tag by commit SHA always; move `latest` only on the default branch, so a
    # consuming project pinned to `latest` never picks up an unmerged change.
    - |
      DESTINATIONS="--destination $IMAGE:$CI_COMMIT_SHORT_SHA"
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        DESTINATIONS="$DESTINATIONS --destination $IMAGE:latest"
      fi
      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/Dockerfile" \
        $DESTINATIONS
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - Dockerfile
        - requirements.txt
        - pyproject.toml
        - src/**/*
        - prompts/**/*
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# -------------------------------------------------------------------- review

# The agent reviewing its own merge requests.
#
# Deliberately runs `:latest` — the image built from the default branch — and
# uses the prompts baked into it, never the ones in the branch under review. A
# merge request that edits a prompt is reviewed by the *current trusted* prompt,
# not by the version it is proposing. Pointing SECURITY_SCAN_PROMPT_DIR at the
# checkout here would let any merge request rewrite the instructions of the
# agent reviewing it, which is the exact hole the prompt-loading rules exist to
# close.
self-review:
  stage: review
  image: $IMAGE:latest
  timeout: 1h
  interruptible: true
  needs: []
  variables:
    GIT_DEPTH: 0
    SECURITY_SCAN_FAIL_ON: high
    SECURITY_SCAN_EFFORT: high
    SECURITY_SCAN_OUTPUT_DIR: .security-scan
  script:
    - gitlab-security-agent
  artifacts:
    when: always
    expire_in: 30 days
    expose_as: 'AI security review'
    paths:
      - .security-scan/
  rules:
    - if: $CI_MERGE_REQUEST_LABELS =~ /skip-ai-security/
      when: never
    - if: $CI_MERGE_REQUEST_IID
