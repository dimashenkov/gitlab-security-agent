# Anthropic's own AI security reviewer, run alongside ours on the same pull
# requests so the two can be compared on identical diffs.
#
# This is a benchmark, not a second gate: it is the closest published tool to
# what this repository builds — semantic, diff-aware, language-agnostic — so
# where the two disagree is the interesting part. Kept non-blocking on purpose;
# a comparison that fails the build is a comparison nobody runs twice.

name: Security review (Anthropic action)

permissions:
  pull-requests: write # to leave the review comments
  contents: read

on:
  pull_request:

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      # Stop before the benchmark rather than run it blind. Without the secret
      # the action reports `conclusion: success` with zero findings, which is
      # indistinguishable from a clean review — the exact failure this
      # repository exists to prevent, and one we watched happen in their run on
      # 2026-08-22 before writing it down. The repository has no secrets set, so
      # the first pull request ever opened here would collect a green check from
      # a review that never ran.
      - name: Refuse to benchmark without a key
        if: ${{ secrets.CLAUDE_API_KEY == '' }}
        run: |
          echo "CLAUDE_API_KEY is not set, so the benchmark cannot run."
          echo "Not skipping quietly: the action would report success with"
          echo "zero findings, which reads as a clean review."
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # The action diffs against the base, so it needs more than the tip.
          fetch-depth: 0

      # Pinned to a commit, not to `@main`. This step is handed an API key, and
      # a branch reference means whatever that branch holds on the morning the
      # job runs — the key trusted to code nobody here has read and that can
      # change between two runs of the same comparison.
      #
      # 0c6a49f is `main` as of 2026-02-11. Moving it is a deliberate act with
      # a reading of the diff behind it, which is the whole point of pinning.
      #
      # It pins the action's own code and nothing else. The model is left at
      # the action's default on purpose — see below — and a default is an alias
      # the far side controls, so two runs of this benchmark can still differ by
      # a model. That is a caveat to state beside the numbers, not something
      # this pin fixes.
      - uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda
        continue-on-error: true
        with:
          comment-pr: true
          upload-results: true
          claude-api-key: ${{ secrets.CLAUDE_API_KEY }}
          # Left on the action's default model rather than matched to ours.
          # Testing it as it ships is the honest comparison; the model
          # difference is a caveat to state, not a variable to tune away.
